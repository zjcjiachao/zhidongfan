<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击试试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    overflow: hidden;
  }

  #pixel-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #1a1a2e;
  }

  .trigger {
    position: relative;
    z-index: 1;
    color: #e94560;
    font-size: 24px;
    text-decoration: underline;
    cursor: pointer;
    padding: 12px 24px;
    border: 2px solid #e94560;
    border-radius: 8px;
    transition: background 0.2s, color 0.2s;
    background: rgba(26,26,46,0.85);
  }
  .trigger:hover {
    background: #e94560;
    color: #fff;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #16213e;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
  }

  .overlay canvas.char-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .overlay .text-layer {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(ellipse, rgba(22,33,62,0.85) 40%, transparent 80%);
    padding: 40px 60px;
    border-radius: 20px;
    margin-top: 28vh;
  }

  .overlay .big-text {
    font-size: clamp(2rem, 8vw, 5rem);
    font-weight: 900;
    color: #e94560;
    text-shadow: 0 0 40px rgba(233, 69, 96, 0.6), 0 0 80px rgba(233, 69, 96, 0.3);
    animation: pulse 0.8s ease-in-out infinite alternate;
    text-align: center;
    line-height: 1.4;
  }

  .overlay .hint {
    margin-top: 30px;
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    animation: fadeHint 2s ease-in-out infinite;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }

  @keyframes fadeHint {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.8; }
  }
</style>
</head>
<body>

<canvas id="pixel-bg"></canvas>

<a class="trigger">点我试试</a>

<div class="overlay" id="overlay">
  <canvas class="char-canvas" id="char-canvas"></canvas>
  <div class="text-layer">
    <div class="big-text">刘亚冰，史雨禅。<br>两个大笨蛋</div>
    <div class="hint">点击任意位置关闭</div>
  </div>
</div>

<script>
  const trigger = document.querySelector('.trigger');
  const overlay = document.getElementById('overlay');

  trigger.addEventListener('click', () => {
    overlay.style.display = 'flex';
    startCharAnimation();
  });

  overlay.addEventListener('click', () => {
    overlay.style.display = 'none';
    stopCharAnimation();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.style.display === 'flex') {
      overlay.style.display = 'none';
      stopCharAnimation();
    }
  });

  // ── 弹窗像素角色动画 ──
  const charCanvas = document.getElementById('char-canvas');
  const charCtx = charCanvas.getContext('2d');
  const charImg = new Image();
  charImg.src = 'pixel-character.webp';

  const PX = 8;       // 像素块大小
  let charScale = 6;   // 角色缩放
  let animFrame = 0;
  let charAnimId = null;
  let isCharReady = false;

  charImg.onload = () => { isCharReady = true; };

  function resizeCharCanvas() {
    const size = Math.min(window.innerWidth * 0.85, window.innerHeight * 0.55);
    charCanvas.width = size;
    charCanvas.height = size;
    charScale = Math.floor(size / 48);
  }
  window.addEventListener('resize', resizeCharCanvas);
  resizeCharCanvas();

  // 画像素矩形 (相对于画布中心)
  function px(x, y, w, h, color) {
    const cx = charCanvas.width / 2;
    const cy = charCanvas.height / 2;
    charCtx.fillStyle = color;
    charCtx.fillRect(cx + x * charScale, cy + y * charScale, w * charScale, h * charScale);
  }

  // 画伸出的舌头
  function drawTongue(phase, wiggle) {
    const tongueLen = 4 + Math.abs(Math.sin(phase * 0.8)) * 8; // 4-12 像素长
    const wiggleX = Math.sin(phase * 1.5) * wiggle * 3;
    const baseY = 16; // 嘴巴位置
    const baseX = -3;

    // 舌头主体
    for (let i = 0; i < tongueLen; i++) {
      const sx = baseX + wiggleX * (i / tongueLen);
      const sy = baseY + i;
      // 舌尖变窄
      const w = i < tongueLen - 2 ? 6 : (i < tongueLen - 1 ? 4 : 2);
      const ox = i < tongueLen - 2 ? 0 : (i < tongueLen - 1 ? 1 : 2);
      const shade = 1 - i / tongueLen * 0.3;
      const r = Math.floor(255 * shade);
      const g = Math.floor(80 * shade);
      const b = Math.floor(110 * shade);
      charCtx.fillStyle = `rgb(${r},${g},${b})`;
      charCtx.fillRect(
        charCanvas.width / 2 + (sx + ox) * charScale,
        charCanvas.height / 2 + sy * charScale,
        w * charScale,
        1 * charScale
      );
    }

    // 腮红 (在嘴巴两侧)
    const blushAlpha = 0.3 + Math.abs(Math.sin(phase * 0.6)) * 0.3;
    charCtx.fillStyle = `rgba(255,120,140,${blushAlpha})`;
    charCtx.fillRect(charCanvas.width / 2 + (-8) * charScale, charCanvas.height / 2 + 13 * charScale, 4 * charScale, 3 * charScale);
    charCtx.fillRect(charCanvas.width / 2 + 4 * charScale, charCanvas.height / 2 + 13 * charScale, 4 * charScale, 3 * charScale);
  }

  // 画鬼脸元素 (斗鸡眼 / 星星眼)
  function drawGooglyEyes(phase) {
    const eyeState = Math.floor(phase / 20) % 4; // 0=正常 1=斗鸡眼 2=单眨眼 3=星星眼

    if (eyeState === 1) {
      // 斗鸡眼
      px(-7, -8, 3, 3, '#fff');
      px(4, -8, 3, 3, '#fff');
      charCtx.fillStyle = '#222';
      charCtx.fillRect(charCanvas.width / 2 + (-3) * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 2 * charScale);
      charCtx.fillRect(charCanvas.width / 2 + 1 * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 2 * charScale);
    } else if (eyeState === 2) {
      // 单眨眼 (左眼闭)
      charCtx.fillStyle = '#222';
      charCtx.fillRect(charCanvas.width / 2 + (-7) * charScale, charCanvas.height / 2 + (-7) * charScale, 3 * charScale, 1 * charScale);
      // 右眼正常
      px(4, -8, 3, 3, '#fff');
      charCtx.fillStyle = '#222';
      charCtx.fillRect(charCanvas.width / 2 + 5 * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 2 * charScale);
    } else if (eyeState === 3) {
      // 星星眼
      px(-7, -8, 3, 3, '#fff');
      px(4, -8, 3, 3, '#fff');
      charCtx.fillStyle = '#e94560';
      charCtx.fillRect(charCanvas.width / 2 + (-6) * charScale, charCanvas.height / 2 + (-7) * charScale, 1 * charScale, 1 * charScale);
      charCtx.fillRect(charCanvas.width / 2 + (-5) * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 1 * charScale);
      charCtx.fillRect(charCanvas.width / 2 + 5 * charScale, charCanvas.height / 2 + (-7) * charScale, 1 * charScale, 1 * charScale);
      charCtx.fillRect(charCanvas.width / 2 + 5 * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 1 * charScale);
    } else {
      // 正常眼
      px(-7, -8, 3, 3, '#fff');
      px(4, -8, 3, 3, '#fff');
      charCtx.fillStyle = '#222';
      charCtx.fillRect(charCanvas.width / 2 + (-6) * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 2 * charScale);
      charCtx.fillRect(charCanvas.width / 2 + 5 * charScale, charCanvas.height / 2 + (-7) * charScale, 2 * charScale, 2 * charScale);
    }
  }

  // 画汗滴
  function drawSweatDrop(x, y, alpha) {
    if (alpha <= 0) return;
    charCtx.fillStyle = `rgba(120,180,255,${alpha})`;
    // 水滴形状用几个像素块拼
    charCtx.fillRect(charCanvas.width / 2 + x * charScale, charCanvas.height / 2 + y * charScale, 3 * charScale, 1 * charScale);
    charCtx.fillRect(charCanvas.width / 2 + (x + 0.5) * charScale, charCanvas.height / 2 + (y + 1) * charScale, 2 * charScale, 1 * charScale);
    charCtx.fillRect(charCanvas.width / 2 + (x + 1) * charScale, charCanvas.height / 2 + (y + 2) * charScale, 1 * charScale, 1 * charScale);
  }

  // 画爱心粒子
  function drawHeartParticle(x, y, size, alpha) {
    if (alpha <= 0) return;
    charCtx.fillStyle = `rgba(255,100,130,${alpha})`;
    const s = size * charScale;
    const px = charCanvas.width / 2 + x * charScale;
    const py = charCanvas.height / 2 + y * charScale;
    charCtx.fillRect(px - s, py - s, s, s);
    charCtx.fillRect(px + s, py - s, s, s);
    charCtx.fillRect(px - s * 2, py, s * 4, s);
    charCtx.fillRect(px - s * 1.5, py + s, s * 3, s);
    charCtx.fillRect(px - s, py + s * 2, s, s);
  }

  let heartParticles = [];
  let sweatDrops = [];

  function spawnHeart() {
    heartParticles.push({
      x: (Math.random() - 0.5) * 30,
      y: -10 - Math.random() * 15,
      size: 0.4 + Math.random() * 0.6,
      alpha: 1,
      vy: -0.3 - Math.random() * 0.5,
      vx: (Math.random() - 0.5) * 0.4,
    });
  }

  function spawnSweat() {
    sweatDrops.push({
      x: -12 + Math.random() * 24,
      y: -12,
      alpha: 0.8,
      vy: 0.3 + Math.random() * 0.3,
    });
  }

  function animateChar() {
    if (!isCharReady) { charAnimId = requestAnimationFrame(animateChar); return; }
    animFrame++;
    const cw = charCanvas.width;
    const ch = charCanvas.height;
    charCtx.clearRect(0, 0, cw, ch);

    const sway = Math.sin(animFrame * 0.04) * 5;   // 左右摇摆角度
    const bounce = Math.sin(animFrame * 0.06) * 8;  // 上下弹跳
    const squash = 1 + Math.sin(animFrame * 0.12) * 0.06; // 压扁拉伸

    charCtx.save();
    charCtx.translate(cw / 2, ch / 2);
    charCtx.translate(0, bounce * charScale);
    charCtx.rotate(sway * Math.PI / 180);
    charCtx.scale(1 / squash, squash);

    // 画角色图片
    const imgSize = 32 * charScale;
    charCtx.drawImage(charImg, -imgSize / 2, -imgSize / 2, imgSize, imgSize);
    charCtx.restore();

    // 画像素舌头 (在图片之上)
    const wiggle = Math.abs(Math.sin(animFrame * 0.07));
    drawTongue(animFrame, wiggle);

    // 画恶搞眼睛
    drawGooglyEyes(animFrame);

    // 汗滴
    if (animFrame % 45 === 0) spawnSweat();
    sweatDrops = sweatDrops.filter(s => {
      s.y += s.vy;
      s.alpha -= 0.03;
      drawSweatDrop(s.x, s.y, s.alpha);
      return s.alpha > 0;
    });

    // 爱心
    if (animFrame % 25 === 0) spawnHeart();
    heartParticles = heartParticles.filter(h => {
      h.x += h.vx;
      h.y += h.vy;
      h.alpha -= 0.02;
      drawHeartParticle(h.x, h.y, h.size, h.alpha);
      return h.alpha > 0;
    });

    charAnimId = requestAnimationFrame(animateChar);
  }

  function startCharAnimation() {
    if (!charAnimId) {
      animFrame = 0;
      heartParticles = [];
      sweatDrops = [];
      resizeCharCanvas();
      animateChar();
    }
  }

  function stopCharAnimation() {
    if (charAnimId) {
      cancelAnimationFrame(charAnimId);
      charAnimId = null;
    }
  }

  // ── 像素卡通吐舌头动态背景 ──
  const canvas = document.getElementById('pixel-bg');
  const ctx = canvas.getContext('2d');
  let characters = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => { resize(); resizeCharCanvas(); spawnCharacters(); });
  resize();

  function drawCharacter(ctx, x, y, scale, tonguePhase) {
    const s = scale;
    const skin = '#ffcc99';
    const skinDark = '#e6a870';
    const hair = '#4a3728';
    const eyeWhite = '#fff';
    const eyePupil = '#222';
    const cheek = '#ff9999';
    const tongueColor = '#ff5c7a';
    const mouthColor = '#8b3a3a';

    function rect(rx, ry, rw, rh, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x + rx * s, y + ry * s, rw * s, rh * s);
    }

    rect(2, 0, 8, 2, hair);
    rect(1, 1, 10, 1, hair);
    rect(1, 2, 1, 1, hair);
    rect(10, 2, 1, 1, hair);
    rect(2, 2, 8, 7, skin);
    rect(1, 3, 10, 4, skin);
    rect(2, 7, 8, 1, skinDark);
    rect(3, 3, 3, 3, eyeWhite);
    rect(7, 3, 3, 3, eyeWhite);
    rect(4, 4, 2, 2, eyePupil);
    rect(8, 4, 2, 2, eyePupil);
    rect(2, 6, 2, 1, cheek);
    rect(9, 6, 2, 1, cheek);

    const tongueLen = Math.abs(Math.sin(tonguePhase)) * 2 + 1;
    rect(4, 7, 5, 1, mouthColor);
    for (let i = 0; i < tongueLen; i++) {
      rect(5, 7 + i, 3, 1, tongueColor);
    }
  }

  function drawHeart(ctx, x, y, scale, alpha) {
    const s = scale;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#e94560';
    ctx.fillRect(x + 0 * s, y + 1 * s, 2 * s, s);
    ctx.fillRect(x + 2 * s, y + 0 * s, s, s);
    ctx.fillRect(x, y, 5 * s, s);
    ctx.globalAlpha = 1;
  }

  function spawnCharacters() {
    characters = [];
    const count = Math.floor((canvas.width * canvas.height) / 18000);
    for (let i = 0; i < count; i++) {
      characters.push({
        x: Math.random() * (canvas.width - 80),
        y: Math.random() * (canvas.height - 80),
        scale: 2 + Math.random() * 2.5,
        phase: Math.random() * Math.PI * 2,
        speed: 0.03 + Math.random() * 0.06,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        heartTimer: 0,
        heartAlpha: 0,
      });
    }
  }
  spawnCharacters();

  let frame = 0;
  function animate() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 60; i++) {
      const sx = (i * 137.5 + frame * 0.1) % canvas.width;
      const sy = (i * 251.3) % canvas.height;
      const twinkle = Math.sin(frame * 0.05 + i) * 0.5 + 0.5;
      ctx.globalAlpha = twinkle * 0.6;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    characters.forEach((ch) => {
      ch.phase += ch.speed;
      ch.x += ch.vx;
      ch.y += ch.vy;
      if (ch.x < 0) { ch.x = 0; ch.vx *= -1; }
      if (ch.x > canvas.width - 80) { ch.x = canvas.width - 80; ch.vx *= -1; }
      if (ch.y < 0) { ch.y = 0; ch.vy *= -1; }
      if (ch.y > canvas.height - 80) { ch.y = canvas.height - 80; ch.vy *= -1; }
      drawCharacter(ctx, ch.x, ch.y, ch.scale, ch.phase);
      ch.heartTimer--;
      if (ch.heartTimer <= 0 && Math.random() < 0.01) {
        ch.heartTimer = 40;
        ch.heartAlpha = 1;
      }
      if (ch.heartAlpha > 0) {
        ch.heartAlpha -= 0.015;
        drawHeart(ctx, ch.x - 6, ch.y - 14, 1.5, ch.heartAlpha);
      }
    });

    requestAnimationFrame(animate);
  }
  animate();
</script>

</body>
</html>
